name: Publish npm
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require green CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node --input-type=module - <<'JS'
          const url = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/actions/runs?head_sha=' + process.env.RELEASE_SHA;
          const response = await fetch(url, {headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if (!response.ok) throw Error('Cannot verify CI: '+response.status);
          const latest = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/commits/main', {headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if (!latest.ok || (await latest.json()).sha !== process.env.RELEASE_SHA) throw Error('Release commit is no longer the main head');
          const {workflow_runs:runs} = await response.json();
          if (!runs.some(r => r.path === '.github/workflows/ci.yml' && r.head_sha === process.env.RELEASE_SHA && r.event === 'push' && r.conclusion === 'success' && r.head_repository.full_name === process.env.GITHUB_REPOSITORY)) throw Error('No successful trusted CI run for this exact commit');
          JS
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts
      - name: Check immutable version against npm
        id: version
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const {name, version} = JSON.parse(readFileSync('package.json'));
          const response = await fetch('https://registry.npmjs.org/' + encodeURIComponent(name) + '/' + version);
          if (response.status !== 404 && !response.ok) throw Error('Registry lookup failed: ' + response.status);
          appendFileSync(process.env.GITHUB_OUTPUT, 'exists=' + response.ok + '\n');
          if (response.ok) console.log('Version already published; immutable release skipped.');
          JS
      - run: npm audit --audit-level=low
      - run: npm audit signatures
      - name: Publish verified package with provenance
        if: steps.version.outputs.exists != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry release
        run: npm run verify:registry

