name: Publish npm
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts
      - name: Check immutable version against npm
        id: version
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const {name, version} = JSON.parse(readFileSync('package.json'));
          const response = await fetch('https://registry.npmjs.org/' + encodeURIComponent(name) + '/' + version);
          if (response.status !== 404 && !response.ok) throw Error('Registry lookup failed: ' + response.status);
          appendFileSync(process.env.GITHUB_OUTPUT, 'exists=' + response.ok + '\n');
          if (response.ok) console.log('Version already published; immutable release skipped.');
          JS
      - run: npm audit --audit-level=low
      - run: npm audit signatures
      - name: Publish verified package with provenance
        if: steps.version.outputs.exists != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry release
        run: npm run verify:registry
